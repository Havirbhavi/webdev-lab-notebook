<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Exercise 04 - Fetch</title>
    <link rel="stylesheet" href="04-fetch.css" />
    <script src="04-fetch.js" defer></script>
  </head>
  <body>
    <main>
      <nav class="navbar">
        <h1 class="brand-logo">Pokedex</h1>
        <label for="search" class="visually-hidden">Search Pokémon</label>
        <input
          type="search"
          id="search"
          class="search-box"
          placeholder="Search Pokémon..."
        />
      </nav>

      <section id="loader" class="loader-container">
        <img src="../images/loader.gif" alt="Loading" class="loader" />
        <p>Fetching data...</p>
      </section>

      <p id="no-results" class="no-results hidden">
        No Pokémon matched your search.
      </p>

      <section id="pokemon-container" class="pokemon-container"></section>
    </main>
  </body>
</html>
